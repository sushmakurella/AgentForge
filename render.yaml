services:
  # Backend NestJS Web Service
  - type: web
    name: agentforge-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        fromService:
          type: web
          name: agentforge-backend
          property: host
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: FRONTEND_URL
        fromService:
          type: web
          name: agentforge-frontend
          property: host

  # Frontend React / Vite Static Site
  - type: web
    name: agentforge-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: agentforge-backend
          property: host
